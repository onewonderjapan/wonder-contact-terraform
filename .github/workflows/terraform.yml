name: Terraform

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  offline-contract:
    name: Offline contact contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -X utf8 -m unittest discover -s tests -v

  terraform:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: 'Terraform'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Install zip utility
        run: sudo apt-get install zip -y

      - name: Zip Lambda function2
        run: |
          zip -r lambda_function.zip lambda_function.py

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v1
        with:
          terraform_version: 1.6.6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      - name: Upload devUser Lambda function
        run: |
            aws lambda update-function-code --function-name onewonder-contact-message-terraform --zip-file fileb://lambda_function.zip


      - name: Initialize Terraform
        run: terraform init

      - name: Validate Terraform
        run: terraform validate

      - name: Plan Terraform
        run: terraform plan -out=tfplan

      - name: Apply Terraform
        run: terraform apply -auto-approve

      - name: Show Outputs
        run: terraform output
